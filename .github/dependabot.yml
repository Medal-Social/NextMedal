version: 2
updates:
  # Security updates always open against the default branch and ignore any
  # entry that sets target-branch, so this entry exists only to group them.
  # open-pull-requests-limit: 0 disables version updates for this entry
  # without affecting security updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  # Version updates follow the dev -> prod promotion flow.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
