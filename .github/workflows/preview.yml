name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Staging
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      deployments: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create GitHub Deployment
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: preview-${{ github.event.pull_request.number }}
          ref: ${{ github.head_ref }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@33fed32c1ba8775f20366ec9e8d0cd9fe8fc1dd3 # v1

      - name: Log in to container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push container image
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/${{ secrets.CONTAINER_APP_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/${{ secrets.CONTAINER_APP_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/${{ secrets.CONTAINER_APP_NAME }}:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_BASE_URL=https://${{ secrets.CONTAINER_APP_NAME }}---pr-${{ github.event.pull_request.number }}.${{ secrets.AZURE_CONTAINER_APP_REGION }}.azurecontainerapps.io
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
            NEXT_PUBLIC_APP_ENV=preview
          secrets: |
            SANITY_API_READ_TOKEN=${{ secrets.SANITY_API_READ_TOKEN }}

      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Add Container App Extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy Revision with Label
        id: deploy-revision
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          LABEL="pr-${PR_NUMBER}"
          IMAGE="${{ secrets.REGISTRY_URL }}/${{ secrets.CONTAINER_APP_NAME }}:pr-${PR_NUMBER}"
          
          echo "Deploying revision with label: $LABEL"
          
          # Update the container app to create a new revision with the label
          # We force 0 traffic to this label (it's only accessible via the label URL)
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image $IMAGE \
            --revision-suffix $LABEL \
            --set-env-vars NEXT_PUBLIC_APP_ENV=preview \
            --min-replicas 0 \
            --max-replicas 1
            
          # Explicitly set the label for the latest revision we just created
          # Note: The revision name is usually app-name--suffix, but we need to find it dynamically or trust the suffix
          # A safer way to apply the label to the LATEST revision is:
          
          LATEST_REV_NAME=$(az containerapp revision list \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query "[0].name" -o tsv)
            
          echo "Latest revision: $LATEST_REV_NAME"
          
          # Add label to the revision (if not automatically handled by update, though update usually handles active revisions)
          # 'az containerapp update' doesn't have a direct --traffic-label arg in all versions, 
          # so we use 'revision label add' to be precise.
          
          az containerapp revision label add \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --label $LABEL \
            --revision $LATEST_REV_NAME

          # Construct the URL
          # Azure Container App Label URL format: https://<app-name>---<label>.<region>.azurecontainerapps.io
          # We need to fetch the FQDN to be sure or construct it.
          
          APP_FQDN=$(az containerapp show --name ${{ secrets.CONTAINER_APP_NAME }} --resource-group ${{ secrets.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          # FQDN is typically app.region.azurecontainerapps.io
          # Label URL is app---label.region.azurecontainerapps.io
          
          # Split FQDN to insert label
          BASE_HOST=$(echo $APP_FQDN | cut -d'.' -f1)
          REST_DOMAIN=$(echo $APP_FQDN | cut -d'.' -f2-)
          PREVIEW_URL="https://${BASE_HOST}---${LABEL}.${REST_DOMAIN}"
          
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Update GitHub Deployment Status (Success)
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        if: success()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: success
          env: preview-${{ github.event.pull_request.number }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: ${{ steps.deploy-revision.outputs.preview_url }}

      - name: Update GitHub Deployment Status (Failure)
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        if: failure()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: failure
          env: preview-${{ github.event.pull_request.number }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Post Sticky Comment
        uses: marocchino/sticky-pull-request-comment@331f8f5b4215f0445d3c07b4967662a32a2d3e31 # v2
        with:
          header: preview-environment
          message: |
            ### 🚀 Preview Environment Ready!
            
            | Name | Link |
            |------|------|
            | **Preview URL** | [${{ steps.deploy-revision.outputs.preview_url }}](${{ steps.deploy-revision.outputs.preview_url }}) |
            | **Status** | ✅ Deployed |
            | **Commit** | ${{ github.sha }} |
            
            _This preview will scale to zero when idle to save costs._

