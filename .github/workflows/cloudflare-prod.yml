name: Cloudflare [PROD]

# Deploys NextMedal to nextmedal.com (+ www) as a Cloudflare Worker built by
# @opennextjs/cloudflare, mirroring cloudflare-staging.yml but pinned to `prod`
# and the wrangler `production` env. This is the deploy path for nextmedal.com;
# it replaced the Azure Container Apps workflow, which has been removed.
#
# Dormant until you opt in: set the repository variable
# CLOUDFLARE_DEPLOY_ENABLED=true and add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# to the `Prod` GitHub environment (which already holds the Sanity secrets).
# See docs/CLOUDFLARE.md.

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: nextmedal-cloudflare-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest # Blacksmith stalled since 22 Aug — revert when back
    environment: Prod
    permissions:
      contents: read
    env:
      NODE_ENV: production
      CLOUDFLARE_BUILD: 'true'
      NEXT_PUBLIC_BASE_URL: https://www.nextmedal.com
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SANITY_PROJECT_ID: ekjn2yf6
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: '2025-12-23'
      # Server-only Viewer token. Not NEXT_PUBLIC_: that prefix is inlined into
      # public JavaScript. Also uploaded to the Worker as a secret below.
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ secrets.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
      MEDAL_API_KEY: ${{ secrets.MEDAL_API_KEY }}
      MEDAL_API_ENDPOINT: ${{ secrets.MEDAL_API_ENDPOINT }}

    steps:
      # Forms send to Medal Social only (nothing is stored in Sanity), so a
      # Worker without the key would answer every form with an error.
      - name: Require MEDAL_API_KEY
        run: |
          if [ -z "${MEDAL_API_KEY:-}" ]; then
            echo "::error::MEDAL_API_KEY is empty. Add it to the Prod environment (scopes read:contacts + write:contacts) — every form needs it."
            exit 1
          fi

      - name: Require SANITY_API_READ_TOKEN
        run: |
          sanity_token="$(printf '%s' "${SANITY_API_READ_TOKEN:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$sanity_token" ]; then
            echo "::error::SANITY_API_READ_TOKEN is empty. Add a Viewer token to the Prod environment. Do not use a NEXT_PUBLIC_ name."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm exec opennextjs-cloudflare build

      - name: Scan client and Studio bundles for tokens
        run: pnpm scan:client-tokens

      # Land the read token on the Worker that is already deployed. The new
      # server throws when the secret is missing, and `--keep-vars` on the
      # deploy below keeps this value.
      - name: Upload SANITY_API_READ_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sanity_token="$(printf '%s' "$SANITY_API_READ_TOKEN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          # secret put only updates a Worker that already exists. A first deploy
          # creates the Worker, then the later upload step stores the token.
          if pnpm exec wrangler secret list --env production >/dev/null 2>&1; then
            echo "Uploading SANITY_API_READ_TOKEN to nextmedal (production) before deploy..."
            printf '%s' "$sanity_token" | pnpm exec wrangler secret put SANITY_API_READ_TOKEN --env production
          else
            echo "No production Worker yet. The token is uploaded after the first deploy."
          fi

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production --keep-vars

      - name: Upload Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          existing=$(pnpm exec wrangler secret list --env production 2>/dev/null | jq -r '.[].name' 2>/dev/null || echo "")
          echo "Uploading MEDAL_API_KEY to nextmedal (production)..."
          printf '%s' "$MEDAL_API_KEY" | pnpm exec wrangler secret put MEDAL_API_KEY --env production
          echo "Uploading SANITY_API_READ_TOKEN to nextmedal (production)..."
          sanity_token="$(printf '%s' "$SANITY_API_READ_TOKEN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          printf '%s' "$sanity_token" | pnpm exec wrangler secret put SANITY_API_READ_TOKEN --env production
          # Optional: an empty value deletes it, so a removed endpoint doesn't linger under --keep-vars.
          for name in MEDAL_API_ENDPOINT; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              if echo "$existing" | grep -qx "$name"; then
                echo "::warning::Optional secret '$name' is empty — deleting from Worker."
                echo y | pnpm exec wrangler secret delete "$name" --env production
              fi
              continue
            fi
            echo "Uploading $name to nextmedal (production)..."
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" --env production
          done
          # Retired: forms no longer write to Sanity. Remove a token left by older deploys.
          for name in SANITY_WRITE_TOKEN NEXT_PUBLIC_SANITY_BROWSER_TOKEN; do
            if echo "$existing" | grep -qx "$name"; then
              echo "::warning::Retired secret '$name' is still on the Worker — deleting."
              echo y | pnpm exec wrangler secret delete "$name" --env production
            fi
          done

      - name: Verify release freshness
        env:
          SMOKE_URL: ${{ env.NEXT_PUBLIC_BASE_URL }}
        run: node scripts/ci/smoke.mjs

      - name: Summary
        if: always()
        run: |
          echo "### Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: \`nextmedal\`  ·  Routes: <https://nextmedal.com>, <https://www.nextmedal.com>" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA:0:8}\`  ·  Run: ${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
