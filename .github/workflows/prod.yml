name: Production

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches:
      [ prod ]
  # Allow manual trigger
  workflow_dispatch:

# Prevent concurrent production deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Prod
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@33fed32c1ba8775f20366ec9e8d0cd9fe8fc1dd3 # v1

      - name: Log in to container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push container image
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/${{ secrets.CONTAINER_APP_NAME }}:${{ github.run_number }}
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
            NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ secrets.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_APP_ENV=${{ secrets.NEXT_PUBLIC_APP_ENV }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
          secrets: |
            SANITY_API_READ_TOKEN=${{ secrets.SANITY_API_READ_TOKEN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        env:
          CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          RUN_NUMBER: ${{ github.run_number }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ secrets.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_APP_ENV: ${{ secrets.NEXT_PUBLIC_APP_ENV }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
        run: |
          YAML_FILE=$(mktemp --suffix=.yaml)
          trap 'rm -f "$YAML_FILE"' EXIT

          cat > "$YAML_FILE" <<'EOF'
          properties:
            configuration:
              ingress:
                external: true
                targetPort: 3000
                transport: auto
                allowInsecure: false
            template:
              scale:
                minReplicas: 1
                maxReplicas: 1
              containers:
                - name: __CONTAINER_APP_NAME__
                  image: __IMAGE__
                  resources:
                    cpu: 0.25
                    memory: 0.5Gi
                  env:
                    - name: NEXT_PUBLIC_BASE_URL
                      value: "__NEXT_PUBLIC_BASE_URL__"
                    - name: NEXT_PUBLIC_SANITY_PROJECT_ID
                      value: "__NEXT_PUBLIC_SANITY_PROJECT_ID__"
                    - name: NEXT_PUBLIC_SANITY_DATASET
                      value: "__NEXT_PUBLIC_SANITY_DATASET__"
                    - name: SANITY_API_READ_TOKEN
                      value: "__SANITY_API_READ_TOKEN__"
                    - name: NEXT_PUBLIC_UMAMI_SCRIPT_URL
                      value: "__NEXT_PUBLIC_UMAMI_SCRIPT_URL__"
                    - name: NEXT_PUBLIC_UMAMI_WEBSITE_ID
                      value: "__NEXT_PUBLIC_UMAMI_WEBSITE_ID__"
                    - name: NEXT_PUBLIC_APP_ENV
                      value: "__NEXT_PUBLIC_APP_ENV__"
                    - name: NEXT_PUBLIC_SENTRY_DSN
                      value: "__NEXT_PUBLIC_SENTRY_DSN__"
                  probes:
                    - type: liveness
                      httpGet:
                        path: /api/health
                        port: 3000
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 3
                    - type: readiness
                      httpGet:
                        path: /api/health
                        port: 3000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
          EOF

          # Replace placeholders with actual values using sed
          sed -i "s|__CONTAINER_APP_NAME__|${CONTAINER_APP_NAME}|g" "$YAML_FILE"
          sed -i "s|__IMAGE__|${REGISTRY_URL}/${CONTAINER_APP_NAME}:${RUN_NUMBER}|g" "$YAML_FILE"
          sed -i "s|__NEXT_PUBLIC_BASE_URL__|${NEXT_PUBLIC_BASE_URL}|g" "$YAML_FILE"
          sed -i "s|__NEXT_PUBLIC_SANITY_PROJECT_ID__|${NEXT_PUBLIC_SANITY_PROJECT_ID}|g" "$YAML_FILE"
          sed -i "s|__NEXT_PUBLIC_SANITY_DATASET__|${NEXT_PUBLIC_SANITY_DATASET}|g" "$YAML_FILE"
          sed -i "s|__SANITY_API_READ_TOKEN__|${SANITY_API_READ_TOKEN}|g" "$YAML_FILE"
          sed -i "s|__NEXT_PUBLIC_UMAMI_SCRIPT_URL__|${NEXT_PUBLIC_UMAMI_SCRIPT_URL}|g" "$YAML_FILE"
          sed -i "s|__NEXT_PUBLIC_UMAMI_WEBSITE_ID__|${NEXT_PUBLIC_UMAMI_WEBSITE_ID}|g" "$YAML_FILE"
          sed -i "s|__NEXT_PUBLIC_APP_ENV__|${NEXT_PUBLIC_APP_ENV}|g" "$YAML_FILE"
          sed -i "s|__NEXT_PUBLIC_SENTRY_DSN__|${NEXT_PUBLIC_SENTRY_DSN}|g" "$YAML_FILE"

          # Remove leading indentation from YAML file (the indentation was needed for GH Actions parsing)
          sed -i 's/^          //' "$YAML_FILE"

          az containerapp update \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --yaml "$YAML_FILE"
