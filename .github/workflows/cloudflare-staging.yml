name: Cloudflare [STAGING]

# Deploys NextMedal to staging.nextmedal.com as a Cloudflare Worker built by
# @opennextjs/cloudflare. Trigger: push to `dev`.
#
# Dormant until you opt in: set the repository variable
# CLOUDFLARE_DEPLOY_ENABLED=true and add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# (plus the server-only SANITY_API_READ_TOKEN etc. used below) to the `Staging`
# GitHub environment. See docs/CLOUDFLARE.md.

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: nextmedal-cloudflare-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest # Blacksmith stalled since 22 Aug — revert when back
    environment: Staging
    permissions:
      contents: read
    env:
      NODE_ENV: production
      # OpenNext build target: disables the image optimizer and excludes the
      # embedded Studio from the Worker bundle (see next.config.ts).
      CLOUDFLARE_BUILD: 'true'
      # Constants for staging — hardcoded so they're stable regardless of how
      # Infisical syncs values. Next.js inlines NEXT_PUBLIC_* at build time.
      NEXT_PUBLIC_BASE_URL: https://staging.nextmedal.com
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_SANITY_PROJECT_ID: ekjn2yf6
      # Keep the website and embedded Studio isolated from production: the
      # dataset is inlined at build time, so the Worker var alone is not enough.
      NEXT_PUBLIC_SANITY_DATASET: staging
      NEXT_PUBLIC_SANITY_API_VERSION: '2025-12-23'
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ secrets.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
      # Server-only env — needed during build for any RSC/ISR fetch that touches
      # Sanity, and pushed to the Worker as secrets below for runtime access.
      MEDAL_API_KEY: ${{ secrets.MEDAL_API_KEY }}
      MEDAL_API_ENDPOINT: ${{ secrets.MEDAL_API_ENDPOINT }}

    steps:
      # Forms send to Medal Social only (nothing is stored in Sanity), so a
      # Worker without the key would answer every form with an error.
      - name: Require MEDAL_API_KEY
        run: |
          if [ -z "${MEDAL_API_KEY:-}" ]; then
            echo "::error::MEDAL_API_KEY is empty. Add it to the Staging environment (scopes read:contacts + write:contacts) — every form needs it."
            exit 1
          fi

      # The read token is step-scoped. Checkout, deploy, and the summary never see it.
      - name: Require SANITY_API_READ_TOKEN
        env:
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
        run: |
          sanity_token="$(printf '%s' "${SANITY_API_READ_TOKEN:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$sanity_token" ]; then
            echo "::error::SANITY_API_READ_TOKEN is empty. Add a Viewer token to the Staging environment. Do not use a NEXT_PUBLIC_ name."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        env:
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
        run: pnpm exec opennextjs-cloudflare build

      - name: Scan client and Studio bundles for tokens
        env:
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
        run: pnpm scan:client-tokens

      # Land the read token on the Worker that is already deployed. The new
      # server throws when the secret is missing, and `--keep-vars` on the
      # deploy below keeps this value. Other secrets are reconciled after.
      - name: Upload SANITY_API_READ_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
        run: |
          set -euo pipefail
          sanity_token="$(printf '%s' "$SANITY_API_READ_TOKEN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          # secret put only updates a Worker that already exists. Skip it only
          # when Cloudflare says this Worker is missing (code 10007). Any other
          # failure stops the job before deploy.
          list_err=$(mktemp)
          missing_worker='(^|[^0-9])10007([^0-9]|$)|This Worker does not exist'
          if pnpm exec wrangler secret list >/dev/null 2>"$list_err"; then
            rm -f "$list_err"
            echo "Uploading SANITY_API_READ_TOKEN to nextmedal-staging before deploy..."
            printf '%s' "$sanity_token" | pnpm exec wrangler secret put SANITY_API_READ_TOKEN
          elif grep -Eq "$missing_worker" "$list_err"; then
            rm -f "$list_err"
            echo "No staging Worker yet. The token is uploaded after the first deploy."
          else
            echo "::error::Could not list staging Worker secrets. Deploy was not started."
            cat "$list_err" >&2
            rm -f "$list_err"
            exit 1
          fi

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars

      # Push the server-only secrets the app uses to the Worker. MEDAL_API_KEY
      # is required (checked before the build); MEDAL_API_ENDPOINT is optional.
      - name: Upload Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(pnpm exec wrangler secret list 2>/dev/null | jq -r '.[].name' 2>/dev/null || echo "")
          echo "Uploading MEDAL_API_KEY to nextmedal-staging..."
          printf '%s' "$MEDAL_API_KEY" | pnpm exec wrangler secret put MEDAL_API_KEY
          echo "Uploading SANITY_API_READ_TOKEN to nextmedal-staging..."
          sanity_token="$(printf '%s' "$SANITY_API_READ_TOKEN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          printf '%s' "$sanity_token" | pnpm exec wrangler secret put SANITY_API_READ_TOKEN
          # Optional: an empty value deletes it, so a removed value doesn't linger under --keep-vars.
          for name in MEDAL_API_ENDPOINT; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              if echo "$existing" | grep -qx "$name"; then
                echo "::warning::Optional secret '$name' is empty — deleting from Worker."
                echo y | pnpm exec wrangler secret delete "$name"
              fi
              continue
            fi
            echo "Uploading $name to nextmedal-staging..."
            printf '%s' "$value" | pnpm exec wrangler secret put "$name"
          done
          # Retired: forms no longer write to Sanity. Remove a token left by older deploys.
          for name in SANITY_WRITE_TOKEN NEXT_PUBLIC_SANITY_BROWSER_TOKEN; do
            if echo "$existing" | grep -qx "$name"; then
              echo "::warning::Retired secret '$name' is still on the Worker — deleting."
              echo y | pnpm exec wrangler secret delete "$name"
            fi
          done

      - name: Verify release freshness
        env:
          SMOKE_URL: ${{ env.NEXT_PUBLIC_BASE_URL }}
        run: node scripts/ci/smoke.mjs

      - name: Summary
        if: always()
        run: |
          echo "### Staging deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: \`nextmedal-staging\`  ·  Route: <https://staging.nextmedal.com>" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA:0:8}\`  ·  Run: ${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
