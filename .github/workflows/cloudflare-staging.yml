name: Cloudflare [STAGING]

# Deploys NextMedal to staging.nextmedal.com as a Cloudflare Worker built by
# @opennextjs/cloudflare (an alternative to the Azure Container Apps path in
# prod.yml). Trigger: push to `dev`.
#
# Dormant until you opt in: set the repository variable
# CLOUDFLARE_DEPLOY_ENABLED=true and add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# (plus the NEXT_PUBLIC_SANITY_BROWSER_TOKEN etc. used below) to the `Staging`
# GitHub environment. See docs/CLOUDFLARE.md.

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: nextmedal-cloudflare-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Staging
    permissions:
      contents: read
    env:
      NODE_ENV: production
      # OpenNext build target: disables the image optimizer and excludes the
      # embedded Studio from the Worker bundle (see next.config.ts).
      CLOUDFLARE_BUILD: 'true'
      # Constants for staging — hardcoded so they're stable regardless of how
      # Infisical syncs values. Next.js inlines NEXT_PUBLIC_* at build time.
      NEXT_PUBLIC_BASE_URL: https://staging.nextmedal.com
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_SANITY_PROJECT_ID: ekjn2yf6
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: '2025-12-23'
      # Build-time public vars sourced from the environment's secrets.
      NEXT_PUBLIC_SANITY_BROWSER_TOKEN: ${{ secrets.NEXT_PUBLIC_SANITY_BROWSER_TOKEN }}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ secrets.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
      # Server-only env — needed during build for any RSC/ISR fetch that touches
      # Sanity, and pushed to the Worker as secrets below for runtime access.
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      MEDAL_API_KEY: ${{ secrets.MEDAL_API_KEY }}
      MEDAL_API_ENDPOINT: ${{ secrets.MEDAL_API_ENDPOINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm exec opennextjs-cloudflare build

      # Deploy the code first, then reconcile secrets — `wrangler secret put`
      # only works against the currently-deployed version of a Worker.
      # `--keep-vars` preserves existing Worker vars/secrets during the window
      # between deploy and secret reconciliation.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars

      # Push the server-only secrets the app actually uses to the Worker. All
      # are optional in env.ts, so an empty value deletes the secret from the
      # Worker (so a value removed upstream doesn't linger under --keep-vars).
      - name: Upload Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          existing=$(pnpm exec wrangler secret list 2>/dev/null | jq -r '.[].name' 2>/dev/null || echo "")
          for name in SANITY_WRITE_TOKEN MEDAL_API_KEY MEDAL_API_ENDPOINT; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              if echo "$existing" | grep -qx "$name"; then
                echo "::warning::Optional secret '$name' is empty — deleting from Worker."
                echo y | pnpm exec wrangler secret delete "$name"
              fi
              continue
            fi
            echo "Uploading $name to nextmedal-staging..."
            printf '%s' "$value" | pnpm exec wrangler secret put "$name"
          done

      - name: Summary
        if: always()
        run: |
          echo "### Staging deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: \`nextmedal-staging\`  ·  Route: <https://staging.nextmedal.com>" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA:0:8}\`  ·  Run: ${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
